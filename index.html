<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1366">
<title>南安酥梨·数字文化体验馆</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
/* ========== 全局重置与变量 ========== */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --pear:#F5A623;--pear-deep:#E07B00;--pear-light:#FFD180;--pear-cream:#FFF8E7;
  --green:#66BB6A;--green-deep:#2E7D32;--blue:#42A5F5;--blue-deep:#1565C0;
  --ink:#2D3436;--ink-soft:#596566;--line:#EEE7D5;--bg:#FBF6EC;--card:#FFFFFF;
  --shadow:0 6px 24px rgba(224,123,0,.12);--shadow-lg:0 12px 40px rgba(224,123,0,.18);
  --radius:14px;--radius-lg:22px;
}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);overflow-x:hidden;line-height:1.6;
}
a{text-decoration:none;color:inherit;}
ul{list-style:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
img{display:block;max-width:100%;}

/* ========== 导航栏 ========== */
.navbar{
  position:fixed;top:0;left:0;right:0;z-index:1000;height:68px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  box-shadow:0 2px 16px rgba(0,0,0,.07);display:flex;align-items:center;
  padding:0 28px;min-width:1366px;
}
.nav-brand{display:flex;align-items:center;gap:10px;margin-right:36px;flex-shrink:0;}
.nav-logo{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--pear),var(--pear-deep));
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#fff;font-weight:bold;flex-shrink:0;
  box-shadow:0 3px 10px rgba(224,123,0,.35);
}
.nav-brand-text{font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap;}
.nav-brand-text small{display:block;font-size:11px;font-weight:400;color:var(--ink-soft);}
.nav-menu{display:flex;gap:4px;flex:1;justify-content:center;}
.nav-btn{
  padding:8px 16px;font-size:14px;font-weight:500;color:var(--ink-soft);
  border-radius:20px;transition:all .25s;position:relative;white-space:nowrap;
}
.nav-btn:hover{color:var(--pear-deep);background:rgba(245,166,35,.08);}
.nav-btn.active{
  color:#fff;background:linear-gradient(135deg,var(--pear),var(--pear-deep));
  box-shadow:0 3px 12px rgba(224,123,0,.4);
  transform:translateY(-1px);
}
.nav-btn.active::after{
  content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:#fff;
}
.nav-action{
  flex-shrink:0;padding:8px 18px;border-radius:20px;
  background:var(--green);color:#fff;font-size:13px;font-weight:600;
  transition:all .25s;
}
.nav-action:hover{background:var(--green-deep);transform:translateY(-1px);}

/* ========== 主内容区 ========== */
#app{padding-top:68px;min-height:100vh;min-width:1366px;}
.page{display:none;animation:pageIn .55s cubic-bezier(.22,.61,.36,1);}
.page.active{display:block;}
@keyframes pageIn{
  from{opacity:0;transform:translateY(24px) scale(.985);filter:blur(4px);}
  to{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
}

/* ========== 通用布局 ========== */
.container{max-width:1366px;margin:0 auto;padding:0 40px;}
.section{padding:56px 40px;}
.section-title{text-align:center;margin-bottom:36px;}
.section-title h2{
  font-size:32px;font-weight:700;color:var(--ink);
  display:inline-block;position:relative;padding:0 0 12px;
}
.section-title h2::after{
  content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:60px;height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--pear),var(--pear-deep));
  animation:underlineGrow .8s ease .3s both;
}
@keyframes underlineGrow{from{width:0;opacity:0;}to{width:60px;opacity:1;}}
.section-title p{margin-top:10px;color:var(--ink-soft);font-size:15px;}
.eyebrow{
  display:inline-block;padding:4px 14px;border-radius:14px;
  background:rgba(245,166,35,.12);color:var(--pear-deep);
  font-size:13px;font-weight:600;margin-bottom:14px;
}

/* ========== 卡片 ========== */
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:24px;transition:all .3s;overflow:hidden;
}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px);}
.grid{display:grid;gap:20px;}

/* ========== 按钮 ========== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 28px;border-radius:26px;font-size:15px;font-weight:600;
  transition:all .25s;cursor:pointer;
}
.btn-primary{background:linear-gradient(135deg,var(--pear),var(--pear-deep));color:#fff;box-shadow:0 4px 14px rgba(224,123,0,.35);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(224,123,0,.45);}
.btn-secondary{background:var(--green);color:#fff;}
.btn-secondary:hover{background:var(--green-deep);transform:translateY(-2px);}
.btn-outline{background:transparent;border:2px solid var(--pear);color:var(--pear-deep);}
.btn-outline:hover{background:var(--pear);color:#fff;}

/* ========== 数据标签 ========== */
.data-num{font-size:36px;font-weight:800;color:var(--pear-deep);line-height:1.1;}
.data-unit{font-size:14px;color:var(--ink-soft);margin-left:4px;}

/* ========== 滚动条 ========== */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--pear-light);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--pear);}

/* ========== 全局工具类 ========== */
.flex{display:flex;}.flex-center{display:flex;align-items:center;justify-content:center;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.text-center{text-align:center;}.mt-20{margin-top:20px;}.mt-40{margin-top:40px;}

/* ========== 首页 Hero ========== */
.hero{
  position:relative;height:calc(100vh - 68px);min-height:600px;
  display:flex;align-items:center;overflow:hidden;
}
.hero-bg{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#E07B00 0%,#F5A623 40%,#FFD180 100%);
  background-size:200% 200%;
  animation:heroGradient 15s ease infinite;
}
@keyframes heroGradient{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.hero-bg::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 80%, rgba(255,255,255,.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(102,187,106,.2) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.08) 0%, transparent 70%);
}
.hero-bg::after{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
  background-size:60px 60px;
}
.hero-content{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:40px;width:100%;}
.hero-left{flex:1;max-width:680px;color:#fff;animation:heroSlideLeft .8s ease .2s both;}
.hero-right{animation:heroSlideRight .8s ease .3s both;}
@keyframes heroSlideLeft{from{opacity:0;transform:translateX(-40px);}to{opacity:1;transform:translateX(0);}}
@keyframes heroSlideRight{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
.hero-title{
  font-size:72px;font-weight:800;line-height:1.1;margin:10px 0 16px;
  text-shadow:0 4px 24px rgba(0,0,0,.25);letter-spacing:2px;
  animation:titleGlow 3s ease-in-out infinite alternate;
}
@keyframes titleGlow{from{text-shadow:0 4px 24px rgba(0,0,0,.2);}to{text-shadow:0 4px 32px rgba(0,0,0,.35),0 0 40px rgba(255,209,128,.4);}}
.hero-comma{font-size:60px;}
.hero-sub{font-size:22px;font-weight:600;margin-bottom:16px;opacity:.95;}
.hero-desc{font-size:15px;line-height:1.8;opacity:.9;margin-bottom:28px;max-width:560px;}
.hero-actions{display:flex;gap:16px;}
.hero-btn-light{border-color:rgba(255,255,255,.6);color:#fff;}
.hero-btn-light:hover{background:rgba(255,255,255,.2);border-color:#fff;}
.hero-right{flex-shrink:0;}
.hero-ip{text-align:center;}
.ip-figure{
  width:240px;height:320px;margin:0 auto;border-radius:28px;
  background:linear-gradient(160deg,#FFFDF5,#FFF3D6);
  border:4px solid rgba(255,255,255,.55);
  box-shadow:0 18px 40px rgba(160,90,0,.28),inset 0 0 0 2px rgba(255,255,255,.4);
  display:flex;align-items:flex-end;justify-content:center;position:relative;
  overflow:hidden;
  animation:ipFloat 4s ease-in-out infinite;
}
.ip-figure img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;}
.ip-fallback-img{display:none;font-size:120px;line-height:1;padding-bottom:30px;}
.ip-figure.img-fail{background:rgba(255,255,255,.15);}
.ip-figure.img-fail .ip-fallback-img{display:block;}
@keyframes ipFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.ip-name{margin-top:16px;font-size:26px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(160,80,0,.35);letter-spacing:2px;}
.ip-tag{font-size:13px;color:rgba(255,255,255,.85);margin-top:4px;}
.hero-wave{
  position:absolute;bottom:0;left:0;right:0;height:80px;z-index:1;
  background:var(--bg);
  clip-path:polygon(0 60%, 5% 55%, 12% 65%, 20% 50%, 30% 60%, 40% 45%, 50% 58%, 60% 48%, 70% 62%, 80% 50%, 88% 60%, 95% 52%, 100% 58%, 100% 100%, 0 100%);
}

/* ========== 首页 数据卡 ========== */
.home-stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:20px;
  margin-top:-40px;position:relative;z-index:5;padding:0 40px 40px;
}
.home-stat-card{
  background:#fff;border-radius:var(--radius-lg);padding:28px 24px;text-align:center;
  box-shadow:var(--shadow-lg);transition:all .35s cubic-bezier(.22,.61,.36,1);
  border-top:4px solid var(--pear);
  animation:statIn .6s ease both;
}
.home-stat-card:nth-child(1){animation-delay:.4s}
.home-stat-card:nth-child(2){animation-delay:.5s}
.home-stat-card:nth-child(3){animation-delay:.6s}
.home-stat-card:nth-child(4){animation-delay:.7s}
@keyframes statIn{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.home-stat-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 16px 40px rgba(224,123,0,.2);}
.home-stat-num{font-size:42px;font-weight:800;color:var(--pear-deep);background:linear-gradient(135deg,var(--pear),var(--pear-deep));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.home-stat-label{margin-top:6px;font-size:14px;color:var(--ink-soft);}

/* ========== 首页 功能卡 ========== */
.home-features{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:56px;}
.home-feature-card{
  background:#fff;border-radius:var(--radius-lg);padding:32px 28px;
  box-shadow:var(--shadow);cursor:pointer;transition:all .3s;text-align:left;
  border:1px solid var(--line);
}
.home-feature-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--pear-light);}
.hf-icon{
  width:56px;height:56px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;font-size:28px;
  margin-bottom:16px;
}
.home-feature-card h3{font-size:20px;font-weight:700;margin-bottom:8px;}
.home-feature-card p{font-size:14px;color:var(--ink-soft);line-height:1.7;}

/* ========== 梨乡故事页 ========== */
.story-hero{
  background:linear-gradient(135deg,#2E7D32 0%,#66BB6A 50%,#F5A623 100%);
  padding:60px 0;color:#fff;text-align:center;
}
.story-hero-inner{max-width:800px;margin:0 auto;padding:0 40px;}
.story-h2{font-size:42px;font-weight:800;margin:10px 0 16px;text-shadow:0 2px 12px rgba(0,0,0,.15);}
.story-lead{font-size:16px;line-height:1.9;opacity:.95;}

/* 时间轴 */
.timeline{
  position:relative;display:flex;justify-content:stretch;align-items:stretch;
  padding:20px 0 0;overflow-x:auto;min-height:280px;gap:16px;
}
.timeline-track{
  position:absolute;top:40px;left:5%;right:5%;height:4px;
  background:linear-gradient(90deg,var(--pear-light),var(--pear),var(--pear-deep));
  border-radius:2px;
}
.timeline-item{position:relative;flex:1 1 0;min-width:180px;text-align:center;padding-top:60px;display:flex;flex-direction:column;}
.timeline-dot{
  position:absolute;top:32px;left:50%;transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;background:var(--pear-deep);
  border:3px solid #fff;box-shadow:0 0 0 3px var(--pear);z-index:2;
}
.timeline-card{
  background:#fff;border-radius:var(--radius);padding:18px 14px;
  box-shadow:var(--shadow);transition:all .3s;
  flex:1;display:flex;flex-direction:column;align-items:center;
  min-height:210px;
}
.timeline-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.timeline-year{
  display:inline-block;padding:2px 12px;border-radius:10px;
  background:rgba(245,166,35,.12);color:var(--pear-deep);
  font-size:13px;font-weight:700;margin-bottom:10px;
}
.timeline-card h4{font-size:16px;font-weight:700;margin-bottom:8px;min-height:24px;}
.timeline-card p{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-top:auto;}

/* 翻转卡片 */
.story-culture{background:linear-gradient(180deg,#FFF8E7,#FBF6EC);}
.flip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.flip-card{
  perspective:1000px;height:260px;cursor:pointer;
}
.flip-inner{
  position:relative;width:100%;height:100%;
  transition:transform .6s;transform-style:preserve-3d;
}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-front,.flip-back{
  position:absolute;inset:0;border-radius:var(--radius-lg);
  backface-visibility:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;color:#fff;
  text-align:center;box-shadow:var(--shadow);
}
.flip-front{font-size:14px;}
.flip-icon{font-size:48px;margin-bottom:12px;}
.flip-ip-img{
  width:64px;height:64px;border-radius:50%;object-fit:cover;
  background:#fff;border:2px solid rgba(255,255,255,.7);
  box-shadow:0 4px 12px rgba(0,0,0,.18);
}
.flip-front h3{font-size:20px;font-weight:700;margin-bottom:6px;}
.flip-back{
  transform:rotateY(180deg);background:linear-gradient(135deg,#2D3436,#596566);
  font-size:14px;line-height:1.8;
}

/* 纪实分栏 */
.story-documentary{background:#fff;}
.doc-layout{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:start;}
.doc-img-frame{
  border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg);
  position:sticky;top:88px;
}
.doc-img-inner{
  height:420px;
  background:
    linear-gradient(180deg,rgba(46,125,50,.3),rgba(224,123,0,.2)),
    linear-gradient(135deg,#66BB6A,#F5A623);
  position:relative;display:flex;align-items:center;justify-content:center;
}
.doc-img-inner::before{
  content:'🍐';font-size:80px;position:absolute;top:30%;left:20%;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.2));
}
.doc-img-inner::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,transparent,rgba(46,125,50,.4));
}
.doc-img-inner.has-photo{background:none;}
.doc-img-inner.has-photo::before{content:none;}
.doc-img-inner.has-photo::after{content:none;}
.doc-img-inner.has-photo img{
  width:100%;height:100%;object-fit:cover;display:block;
  position:relative;z-index:1;
}
.doc-img-cap{
  padding:12px 16px;background:#fff;text-align:center;
  font-size:14px;color:var(--ink-soft);font-weight:500;
}
.doc-text{display:flex;flex-direction:column;gap:24px;}
.doc-block{
  background:var(--pear-cream);border-radius:var(--radius);padding:24px;
  border-left:4px solid var(--pear);
}
.doc-block h3{font-size:18px;font-weight:700;margin-bottom:10px;color:var(--ink);}
.doc-block p{font-size:14px;line-height:1.8;color:var(--ink-soft);}

/* ========== 产业诊断页 ========== */
.diag-hero{
  background:linear-gradient(135deg,#1565C0 0%,#42A5F5 50%,#66BB6A 100%);
  padding:56px 0;color:#fff;text-align:center;
}
.diag-hero-inner{max-width:820px;margin:0 auto;padding:0 40px;}
.diag-h2{font-size:38px;font-weight:800;margin:10px 0 14px;text-shadow:0 2px 12px rgba(0,0,0,.15);}
.diag-lead{font-size:15px;line-height:1.9;opacity:.95;}

.diag-charts{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.diag-chart-card{
  background:#fff;border-radius:var(--radius-lg);padding:24px;
  box-shadow:var(--shadow);border:1px solid var(--line);
}
.dc-title{font-size:18px;font-weight:700;margin-bottom:12px;text-align:center;color:var(--ink);}
.dc-note{margin-top:12px;padding:12px 16px;background:var(--pear-cream);border-radius:10px;font-size:13px;color:var(--ink-soft);line-height:1.7;}
.dc-note strong{color:var(--pear-deep);}

.diag-pain{background:linear-gradient(180deg,#FFF8E7,#FBF6EC);}
.pain-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.pain-card{
  background:#fff;border-radius:var(--radius-lg);padding:24px;
  box-shadow:var(--shadow);cursor:pointer;transition:all .3s;
  border-top:4px solid var(--pear-deep);
}
.pain-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);}
.pain-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.pain-icon{font-size:28px;}
.pain-head h3{font-size:17px;font-weight:700;flex:1;}
.pain-toggle{
  width:28px;height:28px;border-radius:50%;background:var(--pear-cream);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--pear-deep);
}
.pain-stat{text-align:center;margin-bottom:12px;}
.pain-stat .data-unit{display:block;margin-top:4px;font-size:12px;}
.pain-detail{
  max-height:0;overflow:hidden;transition:max-height .4s;
  border-top:1px dashed var(--line);
}
.pain-detail p{padding-top:12px;font-size:13px;line-height:1.7;color:var(--ink-soft);}

.diag-loss{background:#fff;}
.loss-banner{
  display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;
  background:linear-gradient(135deg,#FFF8E7,#FFE0B2);
  border-radius:var(--radius-lg);padding:40px;box-shadow:var(--shadow);
}
.loss-label{font-size:14px;color:var(--ink-soft);margin-bottom:8px;font-weight:600;}
.loss-num{display:flex;align-items:baseline;gap:12px;}
.loss-num .counter{font-size:64px;font-weight:900;color:var(--pear-deep);line-height:1;}
.loss-range{font-size:24px;font-weight:700;color:var(--pear-deep);}
.loss-desc{margin-top:12px;font-size:14px;color:var(--ink-soft);line-height:1.7;}
.loss-bar-group{display:flex;flex-direction:column;gap:16px;}
.loss-bar-item{display:flex;align-items:center;gap:12px;}
.lb-label{width:90px;font-size:13px;font-weight:600;text-align:right;}
.lb-track{flex:1;height:24px;background:rgba(255,255,255,.5);border-radius:12px;overflow:hidden;}
.lb-fill{height:100%;border-radius:12px;transition:width 1s;}
.lb-val{width:60px;font-size:14px;font-weight:700;color:var(--ink);}

/* ========== 破局方案页 ========== */
.sol-hero{
  background:linear-gradient(135deg,#E07B00 0%,#F5A623 50%,#66BB6A 100%);
  padding:56px 0;color:#fff;text-align:center;
}
.sol-hero-inner{max-width:820px;margin:0 auto;padding:0 40px;}
.sol-h2{font-size:38px;font-weight:800;margin:10px 0 14px;text-shadow:0 2px 12px rgba(0,0,0,.15);}
.sol-lead{font-size:15px;line-height:1.9;opacity:.95;}

.dual-wheel{
  display:grid;grid-template-columns:1fr 80px 1fr;gap:0;align-items:start;
}
.wheel-col{
  background:#fff;border-radius:var(--radius-lg);padding:28px;
  box-shadow:var(--shadow-lg);
}
.wheel-culture{border-top:4px solid var(--pear-deep);}
.wheel-digital{border-top:4px solid var(--blue-deep);}
.wheel-header{display:flex;align-items:center;gap:14px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--line);}
.wheel-icon{
  width:52px;height:52px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  background:var(--pear-cream);flex-shrink:0;
}
.wheel-digital .wheel-icon{background:rgba(66,165,245,.12);}
.wheel-header h3{font-size:22px;font-weight:700;}
.wheel-header p{font-size:13px;color:var(--ink-soft);}
.wheel-items{display:flex;flex-direction:column;gap:16px;}
.wheel-item{
  position:relative;padding:16px 16px 16px 32px;
  background:var(--pear-cream);border-radius:var(--radius);
  transition:all .3s;
}
.wheel-digital .wheel-item{background:rgba(66,165,245,.08);}
.wheel-item:hover{transform:translateX(4px);}
.wi-dot{
  position:absolute;left:14px;top:20px;width:8px;height:8px;border-radius:50%;
  background:var(--pear-deep);
}
.wheel-digital .wi-dot{background:var(--blue-deep);}
.wheel-item h4{font-size:16px;font-weight:700;margin-bottom:6px;}
.wheel-item p{font-size:13px;color:var(--ink-soft);line-height:1.7;}
.st-head{display:flex;align-items:center;justify-content:space-between;}
.st-toggle{
  font-size:12px;color:var(--blue-deep);font-weight:600;
  padding:2px 10px;border-radius:10px;background:rgba(66,165,245,.12);cursor:pointer;
}
.st-detail{max-height:0;overflow:hidden;transition:max-height .4s;}
.st-detail p{margin-top:8px;}
.wheel-center{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-top:120px;
}
.wheel-arrow{
  width:56px;height:56px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--pear-deep);
  box-shadow:var(--shadow);margin-bottom:8px;
}
.wheel-center-label{font-size:12px;color:var(--ink-soft);writing-mode:vertical-rl;}

.sol-matrix{background:linear-gradient(180deg,#FFF8E7,#FBF6EC);}
.matrix-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.matrix-card{
  background:#fff;border-radius:var(--radius-lg);padding:28px 20px;
  box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;
  transition:all .3s;border-top:4px solid var(--pear);
}
.matrix-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);}
.m1{border-top-color:var(--green);}.m2{border-top-color:var(--pear-deep);}
.m3{border-top-color:var(--blue);}.m4{border-top-color:#9C27B0;}
.mc-tier{
  position:absolute;top:10px;right:10px;font-size:11px;color:#fff;
  padding:2px 8px;border-radius:8px;background:var(--pear-deep);
}
.mc-icon{font-size:42px;margin:10px 0;}
.matrix-card h3{font-size:18px;font-weight:700;margin-bottom:8px;}
.matrix-card p{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-bottom:12px;}
.mc-tag{
  display:inline-block;padding:4px 12px;border-radius:12px;
  background:var(--pear-cream);color:var(--pear-deep);font-size:12px;font-weight:600;
}

.sol-loop{background:#fff;}
.loop-diagram{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  padding:24px;background:var(--pear-cream);border-radius:var(--radius-lg);
}
.loop-step{
  background:#fff;border-radius:var(--radius);padding:20px 24px;
  text-align:center;min-width:180px;box-shadow:var(--shadow);transition:all .3s;
}
.loop-step:hover{transform:translateY(-4px);}
.loop-c{border-top:3px solid var(--pear-deep);}
.loop-d{border-top:3px solid var(--blue-deep);}
.ls-icon{font-size:36px;margin-bottom:8px;}
.loop-step h4{font-size:16px;font-weight:700;margin-bottom:6px;}
.loop-step p{font-size:12px;color:var(--ink-soft);line-height:1.6;}
.loop-arrow{font-size:24px;color:var(--pear-deep);font-weight:bold;}
.loop-arrow-back{font-size:24px;color:var(--green-deep);font-weight:bold;margin-left:8px;}

/* ========== 沉浸体验页 ========== */
.exp-hero{
  background:linear-gradient(135deg,#E07B00 0%,#F5A623 40%,#66BB6A 100%);
  padding:56px 0;color:#fff;text-align:center;
}
.exp-hero-inner{max-width:840px;margin:0 auto;padding:0 40px;}
.exp-h2{font-size:34px;font-weight:800;margin:10px 0 14px;text-shadow:0 2px 12px rgba(0,0,0,.15);}
.exp-lead{font-size:15px;line-height:1.9;opacity:.95;}

/* 闯关游戏 */
.game-board{
  background:#fff;border-radius:var(--radius-lg);padding:28px;
  box-shadow:var(--shadow-lg);
}
.game-progress{margin-bottom:24px;}
.gp-stamps{display:flex;justify-content:space-between;margin-bottom:12px;}
.gp-stamp{
  width:44px;height:44px;border-radius:50%;
  background:var(--pear-cream);border:2px dashed var(--pear-light);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:var(--ink-soft);
  transition:all .4s;
}
.gp-stamp.got{
  background:linear-gradient(135deg,var(--pear),var(--pear-deep));
  color:#fff;border:2px solid var(--pear-deep);
  box-shadow:0 3px 10px rgba(224,123,0,.35);
  animation:stampPop .5s ease;
}
@keyframes stampPop{0%{transform:scale(0.5) rotate(-20deg);}60%{transform:scale(1.2) rotate(10deg);}100%{transform:scale(1) rotate(0);}}
.gp-bar{height:6px;background:var(--pear-cream);border-radius:3px;overflow:hidden;}
.gp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--pear),var(--pear-deep));border-radius:3px;transition:width .5s;}
.game-stage{min-height:280px;}
.game-q{text-align:center;padding:20px 0;}
.gq-head{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;}
.gq-icon{font-size:40px;}
.gq-title{font-size:20px;font-weight:700;color:var(--ink);}
.gq-text{font-size:18px;margin-bottom:20px;color:var(--ink);font-weight:500;}
.gq-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:680px;margin:0 auto;}
.gq-opt{
  padding:14px 20px;border-radius:var(--radius);background:var(--pear-cream);
  font-size:15px;text-align:left;transition:all .25s;border:2px solid transparent;
}
.gq-opt:hover{background:#fff;border-color:var(--pear);box-shadow:var(--shadow);}
.gq-opt.correct{background:linear-gradient(135deg,#66BB6A,#2E7D32);color:#fff;border-color:#2E7D32;}
.gq-opt.wrong{background:#FFCDD2;color:#C62828;border-color:#C62828;}
.gq-opt:disabled{cursor:default;}
.gq-feedback{margin-top:16px;text-align:left;max-width:680px;margin-left:auto;margin-right:auto;}
.fb-correct{padding:12px 16px;background:#E8F5E9;border-radius:10px;color:#2E7D32;font-size:14px;line-height:1.7;}
.fb-wrong{padding:12px 16px;background:#FFEBEE;border-radius:10px;color:#C62828;font-size:14px;line-height:1.7;}
.game-complete{text-align:center;padding:20px;}
.gc-trophy{font-size:64px;margin-bottom:12px;animation:trophyBounce 1s ease;}
@keyframes trophyBounce{0%{transform:scale(0) rotate(-180deg);}60%{transform:scale(1.3) rotate(10deg);}100%{transform:scale(1) rotate(0);}}
.game-complete h3{font-size:24px;font-weight:800;color:var(--pear-deep);margin-bottom:8px;}
.gc-cert{max-width:480px;margin:20px auto;}
.cert-border{
  background:linear-gradient(135deg,#FFF8E7,#FFE0B2);
  border:3px double var(--pear-deep);border-radius:var(--radius-lg);
  padding:32px 28px;text-align:center;position:relative;
}
.cert-border h2{font-size:28px;font-weight:800;color:var(--pear-deep);margin-bottom:16px;letter-spacing:4px;}
.cert-border p{font-size:14px;color:var(--ink);line-height:1.8;margin-bottom:8px;}
.cert-score{
  display:inline-block;margin:4px auto 10px;padding:6px 20px;border-radius:16px;
  background:linear-gradient(135deg,var(--pear),var(--pear-deep));color:#fff;
  font-size:15px;font-weight:700;letter-spacing:1px;
}
.cert-seal{
  display:flex;flex-direction:column;align-items:center;
  margin:14px auto 6px;width:108px;
  transform:rotate(-6deg);
}
.cert-seal img{
  width:92px;height:92px;border-radius:50%;object-fit:cover;
  border:3px solid var(--pear-deep);box-shadow:0 4px 12px rgba(224,123,0,.3);
  background:#fff;
}
.cert-seal .seal-txt{
  margin-top:4px;color:var(--pear-deep);font-size:12px;font-weight:700;line-height:1.4;text-align:center;
}
.gc-actions{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.cert-date{margin-top:8px;font-size:12px;color:var(--ink-soft);}

/* 梨乡风物宴 */
.exp-feast{background:linear-gradient(180deg,#FFF8E7,#FBF6EC);}
.feast-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.feast-card{
  background:#fff;border-radius:var(--radius-lg);overflow:hidden;
  box-shadow:var(--shadow);position:relative;transition:all .3s;
}
.feast-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);}
.fc-img{
  height:140px;display:flex;align-items:center;justify-content:center;
  font-size:56px;
}
.fc-info{padding:16px;text-align:center;}
.fc-info h3{font-size:18px;font-weight:700;}
.fc-price{color:var(--pear-deep);font-weight:700;margin-top:4px;}
.fc-detail{
  position:absolute;inset:0;background:rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;transform:translateY(8px);transition:all .3s;
}
.fc-detail p{font-size:14px;color:var(--ink);line-height:1.7;text-align:center;}
.feast-note{
  margin-top:24px;text-align:center;font-size:13px;color:var(--ink-soft);
  display:flex;justify-content:center;gap:12px;flex-wrap:wrap;
}

/* 认领梨树苗 */
.exp-adopt{background:#fff;}
.adopt-layout{display:grid;grid-template-columns:1fr 1.4fr;gap:40px;align-items:center;}
.adopt-tree{
  background:linear-gradient(135deg,#66BB6A,#2E7D32);border-radius:var(--radius-lg);
  padding:40px;text-align:center;color:#fff;box-shadow:var(--shadow-lg);
  min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  transition:all .4s;
}
.adopt-tree.adopted{background:linear-gradient(135deg,#F5A623,#E07B00);}
.at-emoji{font-size:72px;line-height:1;transition:all .4s;}
.at-emoji.adopted{animation:treeGrow .8s ease;}
@keyframes treeGrow{0%{transform:scale(0.5);}50%{transform:scale(1.3);}100%{transform:scale(1);}}
.at-label{font-size:18px;font-weight:600;}
.at-id{font-size:13px;opacity:.8;}
.at-code{font-size:22px;font-weight:800;letter-spacing:1px;font-family:monospace;}
.at-qr{font-size:24px;line-height:1.4;font-family:monospace;margin:8px 0;}
.at-qr-canvas{background:#fff;border-radius:10px;padding:6px;width:120px;height:120px;}
.at-qr-canvas canvas{display:block;width:100%;height:100%;}
.at-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.adopt-tree .btn-sm{
  padding:7px 16px;font-size:13px;border-radius:18px;
  background:rgba(255,255,255,.22);color:#fff;border:1.5px solid rgba(255,255,255,.7);cursor:pointer;
}
.adopt-tree .btn-sm:hover{background:#fff;color:var(--pear-deep);}
.my-trees{
  margin-top:22px;background:#fff;border-radius:var(--radius-lg);
  box-shadow:var(--shadow);padding:20px 24px;
}
.my-trees h4{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.mt-list{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;}
.mt-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 14px;border-radius:10px;background:var(--pear-cream);font-size:13px;
}
.mt-code{font-family:monospace;font-weight:700;color:var(--pear-deep);}
.mt-date{color:var(--ink-soft);font-size:12px;}
.mt-empty{font-size:13px;color:var(--ink-soft);text-align:center;padding:10px 0;}
.at-scan{font-size:14px;opacity:.9;}
.adopt-right{display:flex;flex-direction:column;gap:16px;}
.adopt-step{display:flex;gap:16px;align-items:flex-start;}
.as-num{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--pear),var(--pear-deep));color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;
}
.adopt-step h4{font-size:17px;font-weight:700;margin-bottom:4px;}
.adopt-step p{font-size:13px;color:var(--ink-soft);line-height:1.7;}

/* 四季文旅 */
.exp-season{background:linear-gradient(180deg,#FFF8E7,#FBF6EC);}
.season-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:24px;flex-wrap:wrap;}
.season-tab{
  padding:10px 22px;border-radius:22px;background:#fff;
  font-size:14px;font-weight:600;color:var(--ink-soft);
  box-shadow:var(--shadow);transition:all .25s;border:2px solid transparent;
}
.season-tab:hover{border-color:var(--pear);}
.season-tab.active{background:linear-gradient(135deg,var(--pear),var(--pear-deep));color:#fff;}
.season-display{min-height:220px;}
.sd-card{
  border-radius:var(--radius-lg);padding:36px;color:#fff;
  display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;
  box-shadow:var(--shadow-lg);animation:seasonIn .5s ease;
}
@keyframes seasonIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
.sd-left{}
.sd-icon{font-size:56px;margin-bottom:12px;}
.sd-left h3{font-size:24px;font-weight:800;margin-bottom:10px;}
.sd-left p{font-size:14px;line-height:1.8;opacity:.95;}
.sd-items{display:flex;flex-direction:column;gap:10px;}
.sd-item{
  background:rgba(255,255,255,.2);backdrop-filter:blur(6px);
  padding:10px 16px;border-radius:10px;font-size:14px;
}
.sd-item span{margin-right:8px;color:#FFD180;}

/* ========== 溯源体验页 ========== */
.trace-hero{
  background:linear-gradient(135deg,#1565C0 0%,#42A5F5 50%,#66BB6A 100%);
  padding:56px 0;color:#fff;text-align:center;
}
.trace-hero-inner{max-width:820px;margin:0 auto;padding:0 40px;}
.trace-h2{font-size:38px;font-weight:800;margin:10px 0 14px;text-shadow:0 2px 12px rgba(0,0,0,.15);}
.trace-lead{font-size:15px;line-height:1.9;opacity:.95;}

.scan-area{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:stretch;}
.scan-panel{
  background:#fff;border-radius:var(--radius-lg);padding:26px;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
}
.scan-modes{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.scan-mode{
  flex:1;min-width:100px;padding:9px 6px;border-radius:10px;background:#FFF8E7;
  border:2px solid transparent;font-size:13px;font-weight:600;color:var(--ink-soft);
  cursor:pointer;transition:all .25s;
}
.scan-mode:hover{border-color:var(--pear-light);}
.scan-mode.active{background:rgba(245,166,35,.16);border-color:var(--pear);color:var(--pear-deep);}
.mode-pane{display:none;flex:1;flex-direction:column;}
.mode-pane.active{display:flex;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.scan-viewport{
  position:relative;width:100%;max-width:380px;aspect-ratio:4/3;margin:0 auto;
  background:linear-gradient(135deg,#2b2b2b,#111);border-radius:16px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.scan-viewport video{width:100%;height:100%;object-fit:cover;display:none;}
.scan-viewport.cam-on video{display:block;}
.scan-viewport.cam-on .scan-emoji{display:none;}
.scan-viewport.success{background:linear-gradient(135deg,#2E7D32,#66BB6A);}
.scan-emoji{font-size:72px;transition:all .3s;z-index:1;}
.scan-viewport.success .scan-emoji{display:flex;color:#fff;}
.scan-mask-hint{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:4px 12px;border-radius:12px;
  white-space:nowrap;z-index:3;display:none;
}
.scan-viewport.cam-on .scan-mask-hint{display:block;}
.scan-line{
  position:absolute;left:8%;right:8%;height:2px;
  background:linear-gradient(90deg,transparent,#4ADE80,transparent);
  box-shadow:0 0 12px #4ADE80;top:10%;display:none;z-index:2;
}
.scan-viewport.cam-on .scan-line{display:block;animation:scanSweep 2s ease-in-out infinite;}
@keyframes scanSweep{0%{top:10%;}50%{top:88%;}100%{top:10%;}}
.scan-corner{
  position:absolute;width:26px;height:26px;border:3px solid var(--pear);z-index:3;
}
.scan-corner.tl{top:10px;left:10px;border-right:none;border-bottom:none;border-radius:8px 0 0 0;}
.scan-corner.tr{top:10px;right:10px;border-left:none;border-bottom:none;border-radius:0 8px 0 0;}
.scan-corner.bl{bottom:10px;left:10px;border-right:none;border-top:none;border-radius:0 0 0 8px;}
.scan-corner.br{bottom:10px;right:10px;border-left:none;border-top:none;border-radius:0 0 8px 0;}
.scan-actions{margin-top:18px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.scan-status{margin-top:14px;text-align:center;font-size:14px;color:var(--ink-soft);line-height:1.7;min-height:44px;}
.scan-status.ok{color:#2E7D32;font-weight:700;}
.scan-status.err{color:#C62828;font-weight:600;}
.scan-code-line{font-family:monospace;background:#FFF8E7;border-radius:6px;padding:2px 8px;display:inline-block;margin-top:4px;}
.upload-zone{
  width:100%;max-width:380px;margin:0 auto;border:2px dashed var(--pear);border-radius:16px;
  padding:40px 20px;text-align:center;cursor:pointer;background:#FFFDF7;transition:all .25s;
}
.upload-zone:hover{background:#FFF8E7;border-color:var(--pear-deep);}
.upload-zone .uz-icon{font-size:48px;margin-bottom:10px;}
.upload-zone p{font-size:14px;color:var(--ink-soft);line-height:1.8;}
.upload-preview{max-width:380px;margin:12px auto 0;text-align:center;}
.upload-preview canvas,.upload-preview img{max-width:100%;border-radius:12px;box-shadow:var(--shadow);}
.demo-box{
  width:100%;max-width:380px;margin:0 auto;text-align:center;padding:30px 20px;
  background:linear-gradient(135deg,#FFF8E7,#FFE0B2);border-radius:16px;
}
.demo-box .db-icon{font-size:56px;margin-bottom:12px;}
.scan-side{display:flex;flex-direction:column;gap:20px;}
.qr-sample{
  background:#fff;border-radius:var(--radius-lg);padding:24px;text-align:center;
  box-shadow:var(--shadow-lg);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.qr-sample h4{font-size:16px;font-weight:700;margin-bottom:6px;}
.qr-sample p{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-bottom:14px;}
.qr-sample canvas,.qr-sample img{border-radius:12px;background:#fff;padding:8px;box-shadow:var(--shadow);}
.qr-code-text{font-family:monospace;font-size:12px;color:var(--pear-deep);margin-top:10px;font-weight:700;}
.scan-cert{text-align:center;background:#fff;border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow);}
.cert-badge{
  display:inline-block;padding:20px 28px;border-radius:var(--radius-lg);
  background:linear-gradient(135deg,#2E7D32,#66BB6A);color:#fff;
  box-shadow:var(--shadow-lg);margin-bottom:14px;
}
.cb-icon{
  width:52px;height:52px;border-radius:50%;background:#fff;color:#2E7D32;
  display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold;
  margin:0 auto 8px;
}
.cb-text{font-size:17px;font-weight:700;}
.cb-sub{font-size:12px;opacity:.85;margin-top:4px;}
.scan-cert-desc{font-size:13px;color:var(--ink-soft);line-height:1.7;}

.trace-flow{background:linear-gradient(180deg,#FFF8E7,#FBF6EC);}
.trace-timeline{
  display:flex;align-items:center;justify-content:center;gap:0;
  margin-bottom:32px;flex-wrap:wrap;
}
.tnode{
  display:flex;flex-direction:column;align-items:center;cursor:pointer;
  opacity:.4;transition:all .4s;min-width:140px;
}
.tnode.active{opacity:1;}
.tnode:hover{opacity:.8;}
.tnode-dot{
  width:64px;height:64px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:var(--shadow);border:3px solid var(--line);transition:all .4s;

/* ---------- 0. 静态资源 ---------- */
var ASSETS = {
  ip: '梨小宝IP.png',
  poster: '宣传海报.png'
};
var _imgCache = {};
function loadImg(src){
  if(_imgCache[src]) return Promise.resolve(_imgCache[src]);
  return new Promise(function(resolve,reject){
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){ _imgCache[src]=img; resolve(img); };
    img.onerror = function(){ reject(new Error('图片加载失败:'+src)); };
    img.src = src;
  });
}

/* 二维码绘制（qrcode-generator UMD，全局 qrcode），成功返回true */
function drawQR(canvas, text, size, dark, light){
  if(typeof qrcode==='undefined') return false;
  try{
    var qr = qrcode(0,'M');
    qr.addData(text);
    qr.make();
    var n = qr.getModuleCount();
    var quiet = 4;
    var total = n + quiet*2;
    var cell = Math.floor(size/total);
    var real = cell*total;
    var off = Math.floor((size-real)/2);
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = light || '#ffffff';
    ctx.fillRect(0,0,size,size);
    ctx.fillStyle = dark || '#3E2723';
    for(var r=0;r<n;r++){
      for(var c=0;c<n;c++){
        if(qr.isDark(r,c)){
          ctx.fillRect(off+(c+quiet)*cell, off+(r+quiet)*cell, cell, cell);
        }
      }
    }
    return true;
  }catch(e){ return false; }
}

function navigate(hash){
  location.hash = hash;
}
function highlightNav(hash){
  var btns = document.querySelectorAll('.nav-btn');
  btns.forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-hash')===hash);
  });
}

/* ---------- 3. 路由切换 ---------- */
function router(){
  var hash = location.hash || '#/home';
  var route = ROUTES.find(function(r){return r.hash===hash;}) || ROUTES[0];
  var app = document.getElementById('app');
  // 淡出当前页
  var cur = app.querySelector('.page.active');
  if(cur){cur.style.opacity='0';cur.style.transform='translateY(10px)';}
  if(typeof pageCleanup === 'function'){ try{ pageCleanup(); }catch(e){} }
  setTimeout(function(){
    app.innerHTML = '<div class="page active" id="page-'+route.hash.replace('#/','')+'"></div>';
    var page = app.querySelector('.page');
    route.render(page);
    highlightNav(route.hash);
    window.scrollTo(0,0);
  }, cur?180:0);
}

window.addEventListener('hashchange', router);
window.addEventListener('load', function(){
  renderNav();
  // 预加载本地素材（失败静默，不影响主流程）
  loadImg(ASSETS.ip).catch(function(){});
  loadImg(ASSETS.poster).catch(function(){});
  if(!location.hash) location.hash = '#/home';
  else router();
});

/* ---------- 4. ECharts 安全调用 ---------- */
var _echartInstances = {};
function safeChart(id, opt){
  var el = document.getElementById(id);
  if(!el) return;
  if(typeof echarts === 'undefined'){
    el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:14px;">图表数据见下方文字说明</div>';
    return;
  }
  try{
    var inst = echarts.init(el);
    inst.setOption(opt);
    _echartInstances[id] = inst;
    return inst;
  }catch(e){
    el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:14px;">图表数据见下方文字说明</div>';
  }
}
function chartFallback(id, html){
  var el = document.getElementById(id);
  if(el) el.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;padding:20px;text-align:center;">'+html+'</div>';
}
window.addEventListener('resize', function(){
  Object.keys(_echartInstances).forEach(function(k){
    if(_echartInstances[k]) _echartInstances[k].resize();
  });
});

function animateCounters(scope){
  var counters = scope.querySelectorAll('.counter');
  counters.forEach(function(c){
    var target = parseInt(c.getAttribute('data-target'));
    var cur = 0;
    var step = Math.ceil(target/60);
    var t = setInterval(function(){
      cur += step;
      if(cur>=target){cur=target;clearInterval(t);}
      c.textContent = cur;
    },25);
  });
}

    <div class="gq-head"><div class="gq-icon">'+q.icon+'</div><div class="gq-title">'+q.title+'</div></div>\

    <div class="gq-opts" id="gq-opts"></div>\
    <div class="gq-feedback" id="gq-feedback"></div>\
  </div>';
  var optsHtml = '';
  q.opts.forEach(function(o,i){
    optsHtml += '<button class="gq-opt" onclick="answerQ('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>';
  });

}
function answerQ(i){
  var q = GAME_QUESTIONS[gameState.step];
  var opts = document.querySelectorAll('.gq-opt');
  var fb = document.getElementById('gq-feedback');
  if(opts[0].disabled) return; // 防重复点击
  opts.forEach(function(o){o.disabled=true;});
  if(i===q.answer){
    opts[i].classList.add('correct');
    gameState.stamps.push(gameState.step);
    gameState.score++;
    fb.innerHTML = '<div class="fb-correct">✓ 回答正确！'+q.explain+'</div>';
  } else {
    opts[i].classList.add('wrong');
    opts[q.answer].classList.add('correct');
    fb.innerHTML = '<div class="fb-wrong">✗ 答错了。正确答案：'+String.fromCharCode(65+q.answer)+'. '+q.opts[q.answer]+'<br>'+q.explain+'</div>';
    gameState.stamps.push(gameState.step); // 仍然给印章（学习体验为主）
  }
  setTimeout(function(){
    gameState.step++;
    if(gameState.step>=5) gameState.completed=true;
    renderGameStage();
  },2800);
}
function resetGame(){
  gameState = {step:0,stamps:[],completed:false,score:0};
  renderGameStage();
}

function downloadCert(score){
  var W=900,H=640;
  var cv=document.createElement('canvas');
  cv.width=W;cv.height=H;
  var ctx=cv.getContext('2d');
  var grade = score===5?'南安酥梨·梨王':score>=3?'南安酥梨·梨乡能手':'南安酥梨·梨园新星';
  loadImg(ASSETS.ip).catch(function(){return null;}).then(function(ipImg){
    // 底纹
    var g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#FFF8E7');g.addColorStop(1,'#FFE8C0');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // 双线边框
    ctx.strokeStyle='#E07B00';ctx.lineWidth=4;
    ctx.strokeRect(24,24,W-48,H-48);
    ctx.lineWidth=1.5;ctx.strokeRect(38,38,W-76,H-76);
    // 标题
    ctx.textAlign='center';
    ctx.fillStyle='#E07B00';
    ctx.font='bold 52px "Microsoft YaHei","PingFang SC",serif';
    ctx.fillText('梨 王 证 书',W/2,120);
    ctx.fillStyle='#8D6E00';
    ctx.font='22px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText('CERTIFICATE OF  NANAN PEAR',W/2,156);
    ctx.strokeStyle='rgba(224,123,0,.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(260,180);ctx.lineTo(640,180);ctx.stroke();
    // 正文
    ctx.fillStyle='#3E3A33';
    ctx.font='26px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText('兹证明 认证达人 完成"寻找梨王宝藏"梨园剧本游全部 5 关挑战',W/2,250);
    ctx.font='bold 30px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillStyle='#E07B00';
    ctx.fillText('答对 '+score+' / 5 题 · 评级：'+grade,W/2,310);
    ctx.fillStyle='#3E3A33';
    ctx.font='22px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText('特授予其南安酥梨数字文化体验馆荣誉称号',W/2,360);
    // IP 圆章
    ctx.save();
    ctx.beginPath();ctx.arc(W/2,452,62,0,Math.PI*2);
    ctx.fillStyle='#fff';ctx.fill();
    ctx.strokeStyle='#E07B00';ctx.lineWidth=3;ctx.stroke();
    ctx.clip();
    if(ipImg){
      var s=Math.min(ipImg.naturalWidth,ipImg.naturalHeight);
      ctx.drawImage(ipImg,(ipImg.naturalWidth-s)/2,(ipImg.naturalHeight-s)/2,s,s,W/2-62,390,124,124);
    } else {
      ctx.fillStyle='#E07B00';ctx.font='64px serif';
      ctx.fillText('🍐',W/2,474);
    }
    ctx.restore();
    // 落款
    ctx.fillStyle='#8D6E00';
    ctx.font='18px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText('梨小宝 · 南安酥梨数字文化体验馆',W/2,556);
    ctx.font='16px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillStyle='#9A8F78';
    ctx.fillText('发证日期：'+new Date().toLocaleDateString('zh-CN')+' ｜ 第二十届全国大学生文化旅游与会展竞赛',W/2,592);
    try{
      var url=cv.toDataURL('image/png');
      var a=document.createElement('a');
      a.download='南安酥梨梨王证书.png';
      a.href=url;
      document.body.appendChild(a);a.click();a.remove();
    }catch(e){
      window.open(cv.toDataURL('image/png'),'_blank');
    }
  });
}

function genTreeId(){
  var yyyy = new Date().getFullYear();
  var list = getAdopted();
  var id;
  // 保证编号不与已有的重复
  do{
    id = 'NA-PEAR-'+yyyy+'-'+String(Math.floor(Math.random()*9000)+1000);
  }while(list.some(function(t){return t.id===id;}));
  return id;
}
function drawAdoptQR(containerId, id){

  if(!box) return;
  box.innerHTML='';
  var payload='https://trace.nananpear.cn/adopt/'+id;
  var cv=document.createElement('canvas');
  cv.style.cssText='width:100%;height:100%;display:block;';
  var ok=drawQR(cv,payload,180,'#5D4037','#ffffff');
  if(ok){ box.appendChild(cv); }
  else {
    box.style.cssText='background:#fff;border-radius:10px;padding:6px;width:120px;height:120px;font-family:monospace;font-size:10px;color:#E07B00;font-weight:700;word-break:break-all;display:flex;align-items:center;justify-content:center;';

}

var __toastTimer=null;
function floatToast(msg){
  var t=document.getElementById('global-toast');
  if(!t){
    t=document.createElement('div');
    t.id='global-toast';
    t.style.cssText='position:fixed;left:50%;bottom:48px;transform:translateX(-50%) translateY(20px);background:rgba(30,30,30,.92);color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;z-index:9999;opacity:0;transition:all .3s;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:80%;text-align:center;';
    document.body.appendChild(t);
  }
  t.textContent=msg;
  requestAnimationFrame(function(){ t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)'; });
  clearTimeout(__toastTimer);
  __toastTimer=setTimeout(function(){
    t.style.opacity='0';t.style.transform='translateX(-50%) translateY(20px)';
  },2400);
}

function sendAIChat(preText){
  var input = document.getElementById('ai-chat-input');
  var text = (preText || input.value || '').trim();
  if(!text) return;
  appendAIMsg('user', text);
  if(!preText) input.value = '';
  var btn = input.nextElementSibling; btn.disabled = true;

  var typing = document.createElement('div');
  typing.className = 'ai-msg typing';
  typing.textContent = ' ';
  var body = document.getElementById('ai-chat-body');
  body.appendChild(typing);
  body.scrollTop = body.scrollHeight;

  setTimeout(function(){
    var resp = matchAIRule(text);
    typing.remove();
    appendAIMsg('bot', resp.reply);
    renderAIQuick(resp.quick);
    btn.disabled = false;
    input.focus();
  }, 550 + Math.random()*400);
}

  q = q.toLowerCase().replace(/[\s，。！？,.!?\-\"]/g,'');

  for(var i=0;i<PEAR_KB.length;i++){

    var score = 0;
    for(var k=0;k<entry.keys.length;k++){
      var kk = entry.keys[k].toLowerCase();
      if(q.indexOf(kk) >= 0){ score += kk.length * 2; }
    }
    if(score > bestScore){ bestScore = score; best = entry; }
  }
  if(best){ return {reply: best.reply, quick: best.quick || ['南安酥梨是什么','梨小宝IP','怎么认领梨树']}; }

function openCamera(){
  var status=document.getElementById('scan-status');
  var btn=document.getElementById('cam-btn');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    status.className='scan-status err';
    status.innerHTML='当前环境不支持调用摄像头（需 Chrome / Edge，并通过 localhost 或 HTTPS 访问）。<br>请改用"上传识别"或"演示模式"。';
    return;
  }
  if(window.isSecureContext===false){
    status.className='scan-status err';
    status.innerHTML='非安全上下文无法调用摄像头。请通过 localhost 或 HTTPS 访问本页面。<br>可改用"上传识别"或"演示模式"。';
    return;
  }
  if(typeof jsQR==='undefined'){
    status.className='scan-status err';
    status.innerHTML='二维码解码库（jsQR）未加载，请检查网络后刷新页面。<br>可先使用"上传识别"或"演示模式"。';
    return;
  }
  status.className='scan-status';
  status.textContent='正在请求摄像头权限…（请在浏览器弹窗中点击"允许"）';
  btn.disabled=true;
  var mediaPromise=navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  var timeoutPromise=new Promise(function(_,reject){
    setTimeout(function(){ reject({name:'TimeoutError',message:'请求超时'}); }, 20000);
  });
  Promise.race([mediaPromise,timeoutPromise])
    .then(function(stream){
      traceState.stream=stream;
      var video=document.getElementById('scan-video');
      video.srcObject=stream;
      return video.play();
    })
    .then(function(){
      btn.disabled=false;
      traceState.camOn=true;
      var vp=document.getElementById('scan-viewport');
      vp.classList.remove('success'); vp.classList.add('cam-on');
      var emoji=document.getElementById('scan-emoji'); if(emoji) emoji.textContent='';
      btn.textContent='关闭摄像头'; btn.className='btn btn-outline';
      status.innerHTML='摄像头已开启，请将右侧溯源二维码对准取景框…<br>（识别成功后将自动停止）';
      traceState.raf=requestAnimationFrame(scanLoop);
    })
    .catch(function(err){
      btn.disabled=false;
      traceState.stream=null;
      status.className='scan-status err';
      var reason;
      if(err.name==='NotAllowedError'||err.name==='SecurityError'){
        reason='摄像头权限被拒绝。请点击浏览器地址栏左侧的锁形图标，允许摄像头权限后重试。';
      } else if(err.name==='NotFoundError'||err.name==='OverconstrainedError'){
        reason='未检测到可用的摄像头设备。';
      } else if(err.name==='NotReadableError'){
        reason='摄像头被其他程序占用，请关闭占用程序后重试。';
      } else if(err.name==='TimeoutError'){
        reason='摄像头权限请求超时（未检测到授权操作）。';
      } else {
        reason='摄像头调用失败：'+(err.message||err.name);
      }
      status.innerHTML=reason+'<br>也可使用"上传识别"或"演示模式"。';
    });
}
var __frameTick=0;
function scanLoop(){
  if(!traceState.camOn) return;
  var video=document.getElementById('scan-video');
  __frameTick++;
  if(video && video.readyState===video.HAVE_ENOUGH_DATA && (__frameTick%4===0) && !traceState.busy){
    if(!traceState.scanCanvas) traceState.scanCanvas=document.createElement('canvas');
    var c=traceState.scanCanvas, ctx=c.getContext('2d');
    var scale=Math.min(1, 480/video.videoWidth);
    c.width=Math.round(video.videoWidth*scale);
    c.height=Math.round(video.videoHeight*scale);
    ctx.drawImage(video,0,0,c.width,c.height);
    try{
      var img=ctx.getImageData(0,0,c.width,c.height);
      var code=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});
      if(code && code.data){ onQrDecoded(code.data,'camera'); return; }
    }catch(e){}
  }
  traceState.raf=requestAnimationFrame(scanLoop);
}
function stopCamera(){
  shutdownCameraTracks(false);
  var vp=document.getElementById('scan-viewport');
  if(vp) vp.classList.remove('cam-on');
}
function shutdownCameraTracks(keepFrame){
  traceState.camOn=false;
  if(traceState.raf){ cancelAnimationFrame(traceState.raf); traceState.raf=0; }
  if(traceState.stream){
    try{ traceState.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    traceState.stream=null;
  }
  if(!keepFrame){
    var video=document.getElementById('scan-video');
    if(video){ try{video.srcObject=null;}catch(e){} }
  }
}
function decodeQrFile(file){
  if(!file) return;
  var status=document.getElementById('upload-status');
  var prev=document.getElementById('upload-preview');
  if(typeof jsQR==='undefined'){
    status.className='scan-status err';
    status.textContent='二维码解码库（jsQR）未加载，请检查网络后刷新页面。';
    return;
  }
  status.className='scan-status';
  status.textContent='正在本地识别图片中的二维码…';
  prev.innerHTML='';
  var url=URL.createObjectURL(file);
  var img=new Image();
  img.onload=function(){
    var show=document.createElement('img'); show.src=url; show.alt='上传的二维码图片';
    prev.appendChild(show);
    var c=document.createElement('canvas');
    var scale=Math.min(1,1200/Math.max(img.width,1));
    c.width=Math.max(1,Math.round(img.width*scale));
    c.height=Math.max(1,Math.round(img.height*scale));
    var ctx=c.getContext('2d');
    ctx.drawImage(img,0,0,c.width,c.height);
    try{
      var data=ctx.getImageData(0,0,c.width,c.height);
      var code=jsQR(data.data,data.width,data.height,{inversionAttempts:'attemptBoth'});
      if(code && code.data){
        URL.revokeObjectURL(url);
        onQrDecoded(code.data,'upload');
      } else {
        status.className='scan-status err';
        status.innerHTML='未在图片中识别到二维码，请更换更清晰、无反光、无旋转的二维码图片。';
      }
    }catch(e){
      status.className='scan-status err';
      status.textContent='图片解析失败，请更换图片重试。';
    }
  };
  img.onerror=function(){
    status.className='scan-status err';
    status.textContent='图片读取失败，请确认上传的是有效图片文件。';
  };
  img.src=url;
}

function traceEscape(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function onQrDecoded(raw, via){
  traceState.busy=true;
  var m = String(raw).match(/NA-PEAR-\d{4}-\d{4}/i);
  var statusId = via==='camera' ? 'scan-status' : via==='upload' ? 'upload-status' : 'demo-status';
  var status=document.getElementById(statusId);
  if(via==='camera'){ shutdownCameraTracks(false); }
  if(!m){
    status.className='scan-status err';
    status.innerHTML='已识别二维码，但内容不是南安酥梨溯源码。<br>解码内容：'+traceEscape(String(raw).slice(0,80))+'<br>可点击"演示模式"查看完整溯源链路。';
    if(via==='camera'){
      var vp=document.getElementById('scan-viewport');
      vp.classList.remove('cam-on');
      var btn=document.getElementById('cam-btn');
      btn.textContent='重新扫码'; btn.className='btn btn-primary';
    }
    traceState.busy=false;
    return;
  }
  var code=m[0].toUpperCase();
  traceState.lastCode=code;
  var viaText = via==='camera' ? '摄像头实时解码' : via==='upload' ? '图片本地解码' : '演示模式';
  status.className='scan-status ok';
  status.innerHTML='✓ 扫码成功！识别方式：'+viaText+'<br>溯源码：<span class="scan-code-line">'+code+'</span>';
  if(via==='camera'){
    var vp2=document.getElementById('scan-viewport');
    vp2.classList.remove('cam-on'); vp2.classList.add('success');
    document.getElementById('scan-emoji').textContent='✅';
    var btn2=document.getElementById('cam-btn');
    btn2.textContent='再扫一次'; btn2.className='btn btn-outline';
  }
  if(via==='upload'){
    status.innerHTML+='<br>已为你激活下方溯源链路。';
  }
  lightUpTrace(code);
  // 累计扫码次数
  try{
    var n=parseInt(localStorage.getItem('pear_scans')||'0',10)+1;
    localStorage.setItem('pear_scans',String(n));
  }catch(e){}
  traceState.busy=false;
}
function lightUpTrace(code){
  if(traceState.lightTimer) clearInterval(traceState.lightTimer);
  traceState.activeNode=0;
  renderTraceTimeline();
  showTraceDetail(0, code);
  var ni=1;
  traceState.lightTimer=setInterval(function(){
    traceState.activeNode=ni;
    renderTraceTimeline();
    showTraceDetail(ni, code);
    ni++;
    if(ni>=TRACE_NODES.length){ clearInterval(traceState.lightTimer); traceState.lightTimer=null; }
  },1000);
}
function renderTraceTimeline(){
  var html = '';
  TRACE_NODES.forEach(function(n,i){
    var active = traceState.activeNode>=i;
    html += '\
    <div class="tnode '+(active?'active':'')+'" onclick="showTraceDetail('+i+')">\
      <div class="tnode-dot">'+n.icon+'</div>\
      <div class="tnode-info"><div class="tnode-title">'+n.title+'</div><div class="tnode-date">'+n.date+'</div></div>\
    </div>';
    if(i<TRACE_NODES.length-1) html += '<div class="tnode-line '+(traceState.activeNode>i?'lit':'')+'"></div>';
  });
  var tl=document.getElementById('trace-timeline');
  if(tl) tl.innerHTML = html;
}
function showTraceDetail(i, code){
  var box = document.getElementById('trace-detail-box');
  if(!box) return;
  var n = TRACE_NODES[i];
  var detail = n.detail;
  if(code && i===TRACE_NODES.length-1){
    detail = detail.replace(/NA-PEAR-\d{4}-\d{4}/, code);
  }
  box.innerHTML = '\
  <div class="td-content">\
    <div class="td-head"><span class="td-icon">'+n.icon+'</span><h4>'+n.title+'</h4><span class="td-date">'+n.date+'</span></div>\
    <p class="td-text">'+detail+'</p>\
  </div>';
}

}

/* 圆头像绘制（居中裁剪） */
function drawCircleImage(ctx,img,cx,cy,r){
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.closePath();ctx.clip();
  if(img){
    var iw=img.naturalWidth, ih=img.naturalHeight;
    var s=Math.min(iw,ih);
    ctx.drawImage(img,(iw-s)/2,(ih-s)/2,s,s,cx-r,cy-r,r*2,r*2);
  } else {
    ctx.fillStyle='#fff';ctx.fillRect(cx-r,cy-r,r*2,r*2);
    ctx.fillStyle='#E07B00';ctx.font=(r*1.1)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🍐',cx,cy+2);
  }
  ctx.restore();
}
/* 以官方宣传海报为底片合成专属海报 */
function composePoster(ctx, posterImg, ipImg, wish){
  var W=1024,H=1024;
  ctx.clearRect(0,0,W,H);
  // 1. 底片：官方宣传海报铺满
  // 以 cover 方式铺满正方形（海报本身为1024x1024，直接绘制）
  var pw=posterImg.naturalWidth, ph=posterImg.naturalHeight;
  var scale=Math.max(W/pw,H/ph);
  var dw=pw*scale, dh=ph*scale;
  ctx.drawImage(posterImg,(W-dw)/2,(H-dh)/2,dw,dh);
  // 2. 底部专属寄语带
  var bandY=848, bandH=H-bandY;
  var bg=ctx.createLinearGradient(0,bandY,0,H);
  bg.addColorStop(0,'rgba(27,94,32,.93)');
  bg.addColorStop(1,'rgba(12,56,20,.97)');
  ctx.fillStyle=bg;ctx.fillRect(0,bandY,W,bandH);
  // 顶部金色细线
  ctx.fillStyle='#F5A623';ctx.fillRect(0,bandY,W,4);
  // 3. 梨小宝IP圆头像
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(108,bandY+bandH/2,70,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#F5A623';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(108,bandY+bandH/2,70,0,Math.PI*2);ctx.stroke();
  drawCircleImage(ctx,ipImg,108,bandY+bandH/2,64);
  // 4. 寄语文字（左对齐，自动换行）
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#FFD180';
  ctx.font='600 24px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.fillText('我 的 专 属 寄 语',208,bandY+46);
  ctx.fillStyle='#ffffff';
  ctx.font='bold 40px "Microsoft YaHei","PingFang SC",sans-serif';
  var lines=wrapTextLines(ctx,wish,780);
  var maxLines=2;
  if(lines.length>maxLines){
    // 超长时缩小字号
    ctx.font='bold 32px "Microsoft YaHei","PingFang SC",sans-serif';
    lines=wrapTextLines(ctx,wish,780);
  }
  var ly=bandY+100;
  lines.slice(0,2).forEach(function(l){ ctx.fillText(l,208,ly); ly+=50; });
  // 5. 日期与品牌落款
  ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.font='20px "Microsoft YaHei","PingFang SC",sans-serif';
  var dateStr=new Date().toLocaleDateString('zh-CN');
  ctx.fillText(dateStr+' · 南安酥梨数字文化体验馆',208,bandY+bandH-20);
}

function composePosterFallback(ctx, wish){
  var W=1024,H=1024;
  var grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#E07B00');grad.addColorStop(.5,'#F5A623');grad.addColorStop(1,'#FFD180');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  ctx.beginPath();ctx.arc(860,820,190,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(W/2,300,110,0,Math.PI*2);ctx.fill();

  wrapText(ctx,wish,W/2,700,800,58);
  ctx.font='24px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.fillText('第二十届全国大学生文化旅游与会展竞赛',W/2,970);

function wrapTextLines(ctx,text,maxW){
  var chars=text.split('');var line='';var lines=[];
  for(var i=0;i<chars.length;i++){
    var test=line+chars[i];
    if(ctx.measureText(test).width>maxW && line){lines.push(line);line=chars[i];}
    else{line=test;}
  }
  if(line)lines.push(line);
  return lines;
}
function wrapText(ctx,text,x,y,maxW,lh){
  var lines=wrapTextLines(ctx,text,maxW);
  var startY=y-(lines.length-1)*lh/2;
  lines.forEach(function(l,j){ctx.fillText(l,x,startY+j*lh);});
}

function copyTextToClipboard(text){
  return new Promise(function(resolve,reject){
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(resolve).catch(function(){
        legacyCopy(text)?resolve():reject();
      });
    } else {
      legacyCopy(text)?resolve():reject();
    }
  });
}
function legacyCopy(text){
  try{
    var ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();ta.setSelectionRange(0,ta.value.length);
    var ok=document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){return false;}
}

  }).catch(function(){

}

function toggleBookForm(){
  var f=document.getElementById('book-form');
  if(!f) return;
  f.classList.toggle('open');
  if(f.classList.contains('open')){
    document.getElementById('bf-name').focus();
    f.scrollIntoView({behavior:'smooth',block:'center'});
  }
}
function submitBooking(){
  var name=document.getElementById('bf-name').value.trim();
  var phone=document.getElementById('bf-phone').value.trim();
  var type=document.getElementById('bf-type').value;
  var date=document.getElementById('bf-date').value;
  var note=document.getElementById('bf-note').value.trim();
  if(!name){ floatToast('请填写您的姓名'); return; }
  if(!/^1[3-9]\d{9}$/.test(phone)){ floatToast('请填写正确的11位手机号'); return; }
  var list;
  try{ list=JSON.parse(localStorage.getItem('pear_bookings')||'[]'); }catch(e){ list=[]; }
  list.push({name:name,phone:phone,type:type,date:date||'待定',note:note,created:new Date().toLocaleString('zh-CN')});
  try{ localStorage.setItem('pear_bookings',JSON.stringify(list)); }catch(e){}
  floatToast('✓ 预约已登记！工作人员将尽快与您联系');
  document.getElementById('bf-name').value='';
  document.getElementById('bf-phone').value='';
  document.getElementById('bf-note').value='';
  document.getElementById('book-form').classList.remove('open');
}

</script>
